name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 to match the npm (11) that writes package-lock.json; an older npm can reject a lockfile that is in
      # sync. `engines` still allows 20.15+ for the n8n instances that install the package.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: n8n-workflow is a types-only peer dependency here, and its tree pulls isolated-vm, a native
      # module that needs a C++ toolchain to build and is never loaded — n8n supplies its own copy at runtime.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      # n8n's community-node rules, the same check n8n's verification runs.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
