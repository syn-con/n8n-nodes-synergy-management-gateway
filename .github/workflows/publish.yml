# Publishes the package to npm when a version tag is pushed.
#
# n8n accepts a community node for verification only if it was published from a GitHub Action with an npm
# provenance statement: anyone can then verify that the package was built by this workflow, from this repository
# and commit. n8n's scanner checks provenance first and refuses to scan a package published any other way.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# The @synergyconsulting organisation must exist on npmjs.com, and the publishing account must be a member of it.
#
# Option A — Trusted Publishing (recommended, no long-lived secret):
#   1. On npmjs.com, open the package's settings → "Trusted Publishers" → "Add a publisher".
#   2. Choose GitHub Actions: owner syn-con, repository n8n-nodes-synergy-management-gateway,
#      workflow publish.yml, environment left blank.
#   3. Leave the NPM_TOKEN secret unset.
#   A package must exist before a trusted publisher can be added to it, so the very first version needs Option B.
#
# Option B — Granular access token:
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token, with read and write access to the
#      @synergyconsulting scope.
#   2. In this repository: Settings → Secrets and variables → Actions → New secret named NPM_TOKEN.
#
# Provenance works with either: it is signed through GitHub's OIDC, whichever way npm authenticates the publish.
#
# ─── RELEASING ─────────────────────────────────────────────────────────────────
#
# Run `npm run release` locally. It lints, builds, asks for the version bump, commits, tags (`2.0.1`) and pushes —
# and the tag push starts this workflow, which publishes exactly the commit the tag points at. Never run
# `npm run release` in CI: it would bump and tag a second time.

name: Publish

on:
  push:
    tags:
      # 2.0.1, 2.1.0-rc.1, … — the tag shape `npm run release` creates (release-it's default); v2.0.1 also works.
      - '*.*.*'
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token for the provenance statement (and for Trusted Publishing).
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check the tag matches the package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
            exit 1
          fi

      # --ignore-scripts: see ci.yml (isolated-vm is never loaded and needs a native toolchain).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # --ignore-scripts so publishing does not re-run the dependency scripts the install skipped; dist/ comes from
      # the Build step, and `files` ships nothing else. --access public is required for a scoped package's first
      # publish.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          # Option B. Unset under Option A, where npm uses the OIDC exchange instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
